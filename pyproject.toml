[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "liveunpack"
version = "0.1.0"
description = "Extract original MP4 videos from JPEG motion photos, without transcoding."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "LiveUnpack contributors"}]
keywords = ["motion-photo", "live-photo", "vivo", "mp4", "lossless"]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: OS Independent", "Topic :: Multimedia :: Video"]

[project.scripts]
liveunpack = "live_export:main"

[tool.setuptools]
py-modules = ["live_export"]
